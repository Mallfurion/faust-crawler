name: Monitor Faust tickets

on:
  schedule:
    - cron: "17 * * * *"
      timezone: "Europe/Bucharest"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: faust-ticket-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check ticket availability and reconcile alerts
        env:
          ALERT_ASSIGNEE: Mallfurion
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PYTHONPATH=src python -m faust_monitor --json-output monitor-report.json
