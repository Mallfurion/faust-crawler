name: Test issue notification

# Set this to "false" and commit the file to stop creating test issues.
env:
  ENABLE_NOTIFICATION_TEST: "true"
  TEST_NOTIFICATION_ASSIGNEE: Mallfurion

on:
  schedule:
    - cron: "29 * * * *"
      timezone: "Europe/Bucharest"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: faust-notification-test
  cancel-in-progress: false

jobs:
  create-test-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Create and assign notification test issue
        if: ${{ env.ENABLE_NOTIFICATION_TEST == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "[Notification test] Hourly run #${GITHUB_RUN_NUMBER}" \
            --assignee "$TEST_NOTIFICATION_ASSIGNEE" \
            --body "This issue was created automatically to test GitHub mobile notifications. It was assigned to **${TEST_NOTIFICATION_ASSIGNEE}**. Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Report that notification testing is disabled
        if: ${{ env.ENABLE_NOTIFICATION_TEST != 'true' }}
        run: echo "Notification testing is disabled. Set ENABLE_NOTIFICATION_TEST to true to re-enable it."

