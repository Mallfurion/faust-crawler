[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faust-ticket-monitor"
version = "0.1.0"
description = "Read-only Entertix ticket availability monitor for Sibiu Faust performances"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
faust-monitor = "faust_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

